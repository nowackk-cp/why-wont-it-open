name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Release, Debug]
    steps:
      - uses: actions/checkout@v7

      - name: Configure (x86)
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Smoke test the CLI on system programs
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          foreach ($exe in "$env:windir\SysWOW64\notepad.exe", "$env:windir\System32\notepad.exe") {
            ./build/cli/Release/neden.exe check $exe --json | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "neden check reported problems for $exe (exit $LASTEXITCODE)" }
          }

      - name: Upload binaries
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: why-wont-it-open-x86
          path: |
            build/cli/Release/neden.exe
            build/gui/Release/WhyWontItOpen.exe
          if-no-files-found: error

  fuzz:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure fuzz target
        run: cmake -S . -B build -A Win32 -DNEDEN_FUZZ=ON -DBUILD_TESTING=OFF

      - name: Build fuzz target
        run: cmake --build build --config Release --target fuzz_pe

      - name: Fuzz the PE parser for 2 minutes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/fuzz-work | Out-Null
          ./build/fuzz/Release/fuzz_pe.exe -max_total_time=120 -max_len=8192 build/fuzz-work fuzz/corpus
          if ($LASTEXITCODE -ne 0) { throw "fuzz_pe exited with $LASTEXITCODE (crash, or the ASan runtime is missing)" }

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
